<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABHWARE</title>
    <link rel="shortcut icon" href="IMAGENS/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="ESTILOS.css/EstiloPrincipal.css">
</head>

<body id="MUDEACOR">
    <header>
        <h1 id="logo">LABHWARE</h1>
    </header>

    <main id="main">
        <div id="main_text" class="main-text">
            <div id="parte-1a">
                <h2>Montar um<br></h2>
                <h2 id="pc">PC</h2><br>
                <h2 id="font-times">não precisa ser</h2><br>
                <h2 id="dificil">DIFÍCIL</h2>
            </div>
            <div id="parte-2" hidden>
                <h2> escolha sua cor </h2> <br>
                <div id="coresmenu">
                    <input type="button" class="butcores" id="butbranco">
                    <input type="button" class="butcores" id="butvermelho">
                    <input type="button" class="butcores" id="butlaranja">
                    <input type="button" class="butcores" id="butverde">
                    <input type="button" class="butcores" id="butciano">
                </div>
            </div>
            <div id="parte-3" hidden>
                <h2> Monte seu PC </h2>
                <div id="divComponentesPC">
                    <div id="divComponenteCPU" class="botoesComponentesPC">
                        <input type="image" draggable="false" src=".\\IMAGENS\\icons\\pc-parts\\cpu.png"
                            alt="Processador" id="botaoCPU">
                    </div>

                    <div id="divComponenteServer" class="botoesComponentesPC">
                        <input type="image" draggable="false" src=".\\IMAGENS\\icons\\pc-parts\\server.png"
                            alt="Gabinete" id="botaoCPU">
                    </div>

                    <div class="componentePCIndividual"></div>

                    <div id="divComponentePlacaMae" class="botoesComponentesPC">
                        <input type="image" draggable="false" src=".\\IMAGENS\\icons\\pc-parts\\motherboard.png"
                            alt="Placa-mãe" id="botaoCPU">
                    </div>

                    <div class="componentePCIndividual"></div>

                    <div id="divComponenteGC" class="botoesComponentesPC">
                        <input type="image" draggable="false" src=".\\IMAGENS\\icons\\pc-parts\\graphic-card.png"
                            alt="Placa de vídeo" id="botaoCPU">
                    </div>

                    <div id="divComponenteHDD" class="botoesComponentesPC">
                        <input type="image" draggable="false" src=".\\IMAGENS\\icons\\pc-parts\\hdd.png"
                            alt="Unidade de armazenamento" id="botaoCPU">
                    </div>

                    <div class="componentePCIndividual"></div>

                    <div id="divComponenteRAM" class="botoesComponentesPC">
                        <input type="image" draggable="false" src=".\\IMAGENS\\icons\\pc-parts\\ram.png"
                            alt="Memória RAM" id="botaoCPU">
                    </div>
                </div>

                <div id="frame-componentes" hidden>
                    <div id="frame-componentes-filtros">
                        <div class="cabecalho-filtros">
                            <h3>Filtros</h3>
                        </div>
                        <div class="categoria-filtros">
                            <h4>Marca:</h4>
                            <form action="" class="opcoes-filtros">
                                <div>
                                    <input type="checkbox" name="marca" id="amd" value="amd">
                                    <label for="amd">AMD</label>
                                </div>
                                <div>
                                    <input type="checkbox" name="marca" id="intel" value="intel">
                                    <label for="intel">Intel</label>
                                </div>
                            </form>
                        </div>
                        <div class="categoria-filtros">
                            <h4>Faixa de preço:</h4>
                            <div class="slider-filtros">
                                <div class="slider-filtros-fundo"></div>
                                <div class="slider-filtros-trilha" id="trilha-ativa"></div>
                                <input type="range" id="preco-min" min="0" max="15000" value="0" step="100">
                                <input type="range" id="preco-max" min="0" max="15000" value="15000" step="100">
                            </div>
                            <p class="valores-preco-filtros">
                                R$ <span id="texto-min">0</span> — R$ <span id="texto-max">15000</span>
                            </p>
                        </div>
                    </div>
                    <div id="frame-componentes-real">
                        <h1>E</h1>
                    </div>

                </div>
            </div>
        </div>
        <input type="button" id="botaoInicio" value="Começar">
    </main>


    <script src="script.js"></script>
</body>

</html>
